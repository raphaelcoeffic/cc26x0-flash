name: algorithm-test
variants:
- name: CC2650F128
  cores:
  - name: main
    type: armv7m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x0
      end: 0x20000
    cores:
    - main
    access:
      boot: true
  - !Ram
    range:
      start: 0x20000000
      end: 0x20005000
    cores:
    - main
  flash_algorithms:
  - cc26x0-flash
  jtag:
    force_scan_chain: true
    scan_chain:
    - name: ICEPICK
      ir_len: 6
flash_algorithms:
- name: cc26x0-flash
  description: Flash algorithm for the cc26x0 family of devices
  default: true
  cores:
  - main
  instructions: ''
  pc_init: 0x0
  pc_uninit: 0x0
  pc_program_page: 0x0
  pc_erase_sector: 0x0
  pc_erase_all: 0x0
  data_section_offset: 0x0
  flash_properties:
    address_range:
      start: 0x0
      end: 0x0
    page_size: 0x0
    erased_byte_value: 0xff
    program_page_timeout: 0x0
    erase_sector_timeout: 0x0
    sectors:
    - size: 0x0
      address: 0x0
